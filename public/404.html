<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA redirect
      const repo = "syncd-store"; // CHANGE if your repo name differs
      const path = location.pathname.replace("/" + repo, "");
      location.replace("/" + repo + "/#"+ path + location.search + location.hash);
    </script>
  </head>
  <body></body>
</html>
